# LLMSmartAudit finding -> taxonomy mapping (SmartBugs `findings.yaml` format).
#
# Keys are the finding NAMES emitted by tools/llmsmartaudit/parser.py, which
# are the 41 detector display titles from the tool's
# chatdev/audit_report.py::DETECTORS table (generated from that table; the
# human-facing companion is the tool's docs/coverage.md).
#
# Fields (same convention as tools/mythril-*/findings.yaml):
#   classification : SWC-### / DASP-# where a faithful mapping exists,
#                    otherwise an honest "logic/DeFi" or "code-quality" label.
#   method         : how the tool decides the finding.
#   descr_short    : what the detector checks.
#   severity       : low | medium | high.
#   detector       : the tool's phase name (stable key in the report JSON).
#
# IMPORTANT: severities are DOCUMENTATION-ASSIGNED defaults per category; the
# LLM itself emits neither severities nor line numbers, and results are
# non-deterministic across runs, models and providers.

"Integer Overflow / Underflow":
    classification: "SWC-101, DASP-3"
    severity: high
    method: Single-shot LLM detector prompt (ArithmeticDetector) over the contract source; positive iff the phase conclusion matches '<INFO> ... Identified.'.
    descr_short: Arithmetic that can exceed type bounds; missing/incomplete SafeMath usage.
    detector: ArithmeticDetector

